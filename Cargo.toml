[package]
name = "seekr-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Rust/Slint implementation of the SeekR desktop launcher"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
meval = "0.2"
arboard = "3"
slint = "1.19.0"
tempfile = "3"

[build-dependencies]
slint-build = "1.19.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
