name: Tests and Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: seekr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || 'windows' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libfreetype6
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Python source and dependencies
        run: |
          python -m compileall -q core features ui tests main.py build.py tools
          python -m pip check
      - name: Run test suite
        run: python -m pytest -q

  windows-build:
    name: Build, install and verify Windows installer
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test and build executable
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          # Build and retain the portable one-file executable before the
          # onedir build used by the installer.
          python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portable = ".\dist\SeekR.exe"
          if (-not (Test-Path -LiteralPath $portable)) { throw "Portable executable was not created: $portable" }
          $portableMetadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $portable).Path)
          if ($portableMetadata.ProductName -ne "SeekR" -or $portableMetadata.ProductVersion -notlike "$version*") {
            throw "Unexpected portable executable metadata: ProductName=$($portableMetadata.ProductName), ProductVersion=$($portableMetadata.ProductVersion)"
          }
          New-Item -ItemType Directory -Force -Path ".\release" | Out-Null
          Copy-Item $portable ".\release\SeekR.exe"
          python build.py --onedir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD\dist\SeekR\SeekR.exe")
          if ($metadata.ProductName -ne "SeekR" -or $metadata.ProductVersion -notlike "$version*") {
            throw "Unexpected installer executable metadata: ProductName=$($metadata.ProductName), ProductVersion=$($metadata.ProductVersion)"
          }
          # Verify the portable one-file executable starts independently too.
          $portableProcess = Start-Process -FilePath (Resolve-Path ".\release\SeekR.exe").Path -ArgumentList @("--hidden", "--no-hotkey", "--allow-multiple") -PassThru
          Start-Sleep -Seconds 8
          if ($portableProcess.HasExited) { throw "Portable SeekR.exe exited during startup (code $($portableProcess.ExitCode))" }
          Stop-Process -Id $portableProcess.Id -Force
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DMyAppVersion=$version" ".\installer\seekr.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = ".\dist\installer\SeekR-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created: $installer" }
      - name: Verify install and uninstall
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $installer = (Resolve-Path ".\dist\installer\SeekR-Setup-$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "SeekR-install-smoke"
          $installLog = Join-Path $env:RUNNER_TEMP "SeekR-installer.log"
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir", "/LOG=$installLog") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "SeekR installer exited with code $($process.ExitCode)" }
          $installedExe = Join-Path $installDir "SeekR.exe"
          $deadline = (Get-Date).AddSeconds(15)
          while (-not (Test-Path -LiteralPath $installedExe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path -LiteralPath $installedExe)) {
            if (Test-Path -LiteralPath $installLog) { Get-Content -LiteralPath $installLog }
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Force -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "SeekR*" } | Select-Object -ExpandProperty FullName
            throw "Installed SeekR.exe is missing"
          }
          # Exercise the installed app itself, not only the installer payload.
          $appProcess = Start-Process -FilePath $installedExe -ArgumentList @("--hidden", "--no-hotkey") -PassThru
          Start-Sleep -Seconds 8
          if ($appProcess.HasExited) { throw "Installed SeekR exited during startup (code $($appProcess.ExitCode))" }
          Stop-Process -Id $appProcess.Id -Force
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "SeekR uninstaller is missing" }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "SeekR uninstaller exited with code $($uninstallProcess.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(15)
          while ((Test-Path -LiteralPath (Join-Path $installDir "SeekR.exe")) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath (Join-Path $installDir "SeekR.exe")) {
            throw "SeekR files remain after uninstall"
          }
      - name: Stage installer and checksums
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          Copy-Item ".\dist\installer\SeekR-Setup-$version.exe" ".\release\"
          Get-ChildItem ".\release" -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath ".\release\SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: SeekR-Windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SeekR-Windows-${{ github.sha }}
          path: artifacts
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SeekR $TAG" --generate-notes
          gh release upload "$TAG" artifacts/SeekR.exe artifacts/SeekR-Setup-*.exe artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
