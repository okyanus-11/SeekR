name: Tests and Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: seekr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || 'windows' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libfreetype6
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Python source and dependencies
        run: |
          python -m compileall -q core features ui tests main.py build.py tools
          python -m pip check
      - name: Run test suite
        run: python -m pytest -q

  windows-build:
    name: Build, install and verify Windows installer
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Windows performance script syntax
        shell: pwsh
        run: |
          foreach ($file in @("tools\windows_test.ps1", "tools\windows_performance.ps1", "tools\windows_stability.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax errors in $file"
              $errors | Format-List
              exit 1
            }
          }
      - name: Test and build executable
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          # Build and retain the portable one-file executable before the
          # onedir build used by the installer.
          python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portable = ".\dist\SeekR.exe"
          if (-not (Test-Path -LiteralPath $portable)) { throw "Portable executable was not created: $portable" }
          $portableMetadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $portable).Path)
          if ($portableMetadata.ProductName -ne "SeekR" -or $portableMetadata.ProductVersion -notlike "$version*") {
            throw "Unexpected portable executable metadata: ProductName=$($portableMetadata.ProductName), ProductVersion=$($portableMetadata.ProductVersion)"
          }
          New-Item -ItemType Directory -Force -Path ".\release" | Out-Null
          Copy-Item $portable ".\release\SeekR.exe"
          python build.py --onedir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD\dist\SeekR\SeekR.exe")
          if ($metadata.ProductName -ne "SeekR" -or $metadata.ProductVersion -notlike "$version*") {
            throw "Unexpected installer executable metadata: ProductName=$($metadata.ProductName), ProductVersion=$($metadata.ProductVersion)"
          }
          # Verify the portable one-file executable starts independently too.
          $portableProcess = Start-Process -FilePath (Resolve-Path ".\release\SeekR.exe").Path -ArgumentList @("--hidden", "--no-hotkey", "--allow-multiple") -PassThru
          Start-Sleep -Seconds 8
          if ($portableProcess.HasExited) { throw "Portable SeekR.exe exited during startup (code $($portableProcess.ExitCode))" }
          Stop-Process -Id $portableProcess.Id -Force
      - name: Verify packaged launcher widgets
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $portable = (Resolve-Path ".\release\SeekR.exe").Path
          $process = Start-Process -FilePath $portable -ArgumentList @("--verify-ui", "--no-hotkey", "--allow-multiple", "--reset-config") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged portable UI verification failed with exit code $($process.ExitCode)" }
      - name: Run packaged stability soak
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "SeekR-stability-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $config = @{
            general = @{ show_tray_icon = $false }
            applications = @{ index_start_menu = $false; refresh_on_start = $false; directories = @() }
            files = @{ enabled = $false; auto_index = $false; directories = @() }
          }
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $profile "config.json") -Encoding utf8
          $env:SEEKR_HOME = $profile
          $exe = (Resolve-Path ".\release\SeekR.exe").Path
          $output = Join-Path $env:RUNNER_TEMP "SeekR-stability-$env:GITHUB_RUN_ID.csv"
          & .\tools\windows_stability.ps1 -ExecutablePath $exe -DurationMinutes 3 -SampleIntervalSeconds 30 -OutputPath $output
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DMyAppVersion=$version" ".\installer\seekr.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = ".\dist\installer\SeekR-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created: $installer" }
      - name: Verify install and uninstall
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $installer = (Resolve-Path ".\dist\installer\SeekR-Setup-$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "SeekR-install-smoke"
          $installLog = Join-Path $env:RUNNER_TEMP "SeekR-installer.log"
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir", "/LOG=$installLog") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "SeekR installer exited with code $($process.ExitCode)" }
          $installedExe = Join-Path $installDir "SeekR.exe"
          $deadline = (Get-Date).AddSeconds(15)
          while (-not (Test-Path -LiteralPath $installedExe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path -LiteralPath $installedExe)) {
            if (Test-Path -LiteralPath $installLog) { Get-Content -LiteralPath $installLog }
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Force -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "SeekR*" } | Select-Object -ExpandProperty FullName
            throw "Installed SeekR.exe is missing"
          }
          # Verify Windows registered the expected product version and install path.
          $uninstallEntry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
            ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
            Where-Object { $_.DisplayName -eq "SeekR" } |
            Select-Object -First 1
          if (-not $uninstallEntry) { throw "SeekR is missing from Windows Installed apps registration" }
          if ($uninstallEntry.DisplayVersion -ne $version) {
            throw "Wrong installed version: expected $version, got $($uninstallEntry.DisplayVersion)"
          }
          if ([IO.Path]::GetFullPath($uninstallEntry.InstallLocation).TrimEnd('\\') -ne [IO.Path]::GetFullPath($installDir).TrimEnd('\\')) {
            throw "Windows uninstall registration points to the wrong install directory: $($uninstallEntry.InstallLocation)"
          }
          # Verify the Start Menu shortcut resolves to the installed executable.
          $shortcutPath = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\SeekR\SeekR.lnk"
          if (-not (Test-Path -LiteralPath $shortcutPath)) { throw "SeekR Start Menu shortcut is missing: $shortcutPath" }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          if ([IO.Path]::GetFullPath($shortcut.TargetPath) -ne [IO.Path]::GetFullPath($installedExe)) {
            throw "SeekR Start Menu shortcut targets the wrong executable: $($shortcut.TargetPath)"
          }
          # Exercise the installed app itself, not only the installer payload.
          $appProcess = Start-Process -FilePath $installedExe -ArgumentList @("--hidden", "--no-hotkey") -PassThru
          Start-Sleep -Seconds 8
          if ($appProcess.HasExited) { throw "Installed SeekR exited during startup (code $($appProcess.ExitCode))" }
          Stop-Process -Id $appProcess.Id -Force
          $uiProcess = Start-Process -FilePath $installedExe -ArgumentList @("--verify-ui", "--no-hotkey", "--allow-multiple", "--reset-config") -Wait -PassThru
          if ($uiProcess.ExitCode -ne 0) { throw "Installed application UI verification failed with exit code $($uiProcess.ExitCode)" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "SeekR uninstaller is missing" }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "SeekR uninstaller exited with code $($uninstallProcess.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(15)
          while ((Test-Path -LiteralPath (Join-Path $installDir "SeekR.exe")) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath (Join-Path $installDir "SeekR.exe")) {
            throw "SeekR files remain after uninstall"
          }
      - name: Verify reinstall after uninstall
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $installer = (Resolve-Path ".\dist\installer\SeekR-Setup-$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "SeekR-install-smoke"
          $installedExe = Join-Path $installDir "SeekR.exe"
          if (Test-Path -LiteralPath $installedExe) { throw "The prior uninstall left SeekR.exe behind" }
          $configPath = Join-Path $env:APPDATA "SeekR\config.json"
          $databasePath = Join-Path $env:APPDATA "SeekR\seekr.db"
          if (-not (Test-Path -LiteralPath $configPath)) { throw "The first install/uninstall did not preserve SeekR settings" }
          if (-not (Test-Path -LiteralPath $databasePath)) { throw "The first install/uninstall did not preserve the SeekR database" }
          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "SeekR reinstall exited with code $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $installedExe)) { throw "SeekR.exe is missing after reinstall" }
          $metadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installedExe)
          if ($metadata.ProductName -ne "SeekR" -or $metadata.ProductVersion -notlike "$version*") {
            throw "Reinstalled executable has wrong metadata: ProductName=$($metadata.ProductName); ProductVersion=$($metadata.ProductVersion)"
          }
          $appProcess = Start-Process -FilePath $installedExe -ArgumentList @("--hidden", "--no-hotkey", "--allow-multiple") -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $appProcess.Refresh()
          if ($appProcess.HasExited) { throw "Reinstalled SeekR exited during startup (code $($appProcess.ExitCode))" }
          Stop-Process -Id $appProcess.Id -Force
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "Reinstalled SeekR uninstaller is missing" }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Reinstalled SeekR uninstaller exited with code $($uninstallProcess.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(15)
          while ((Test-Path -LiteralPath $installedExe) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $installedExe) { throw "SeekR files remain after the second uninstall" }
          if (-not (Test-Path -LiteralPath $configPath)) { throw "Reinstall/uninstall removed SeekR settings" }
          if (-not (Test-Path -LiteralPath $databasePath)) { throw "Reinstall/uninstall removed the SeekR database" }
      - name: Verify upgrade from v2.0.2
        shell: pwsh
        run: |
          $baselineVersion = "2.0.2"
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          if ([version]$version -le [version]$baselineVersion) {
            Write-Host "Skipping the upgrade smoke until APP_VERSION is newer than v$baselineVersion."
            exit 0
          }
          $downloadDir = Join-Path $env:RUNNER_TEMP "SeekR-upgrade-download-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $baselineUrl = "https://github.com/okyanus-11/SeekR/releases/download/v$baselineVersion"
          $checksumsPath = Join-Path $downloadDir "SHA256SUMS.txt"
          $baselineInstaller = Join-Path $downloadDir "SeekR-Setup-$baselineVersion.exe"
          Invoke-WebRequest -Uri "$baselineUrl/SHA256SUMS.txt" -OutFile $checksumsPath -ErrorAction Stop
          Invoke-WebRequest -Uri "$baselineUrl/SeekR-Setup-$baselineVersion.exe" -OutFile $baselineInstaller -ErrorAction Stop
          $pattern = "^([A-Fa-f0-9]{64})\s+SeekR-Setup-$([regex]::Escape($baselineVersion))\.exe$"
          $checksumLine = Get-Content -LiteralPath $checksumsPath | Where-Object { $_ -match "SeekR-Setup-$baselineVersion\.exe$" } | Select-Object -First 1
          if (-not $checksumLine) { throw "The published v$baselineVersion checksum list does not contain the installer" }
          $checksumMatch = [regex]::Match([string]$checksumLine, $pattern)
          if (-not $checksumMatch.Success) { throw "The published v$baselineVersion installer checksum line is malformed" }
          $expectedHash = $checksumMatch.Groups[1].Value.ToUpperInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $baselineInstaller).Hash.ToUpperInvariant()
          if ($actualHash -ne $expectedHash) { throw "The downloaded v$baselineVersion installer checksum does not match SHA256SUMS.txt" }
          $upgradeDir = Join-Path $env:RUNNER_TEMP "SeekR-upgrade-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $upgradeDir) { throw "Upgrade smoke install directory already exists: $upgradeDir" }
          $baselineProcess = Start-Process -FilePath $baselineInstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$upgradeDir") -Wait -PassThru
          if ($baselineProcess.ExitCode -ne 0) { throw "SeekR v$baselineVersion installer exited with code $($baselineProcess.ExitCode)" }
          $baselineExe = Join-Path $upgradeDir "SeekR.exe"
          if (-not (Test-Path -LiteralPath $baselineExe)) { throw "The v$baselineVersion installation did not create SeekR.exe" }
          $baselineMetadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($baselineExe)
          if ($baselineMetadata.ProductName -ne "SeekR" -or $baselineMetadata.ProductVersion -notlike "$baselineVersion*") {
            throw "Baseline executable has wrong metadata: ProductName=$($baselineMetadata.ProductName); ProductVersion=$($baselineMetadata.ProductVersion)"
          }
          $profile = Join-Path $env:APPDATA "SeekR"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $configPath = Join-Path $profile "config.json"
          $databasePath = Join-Path $profile "seekr.db"
          $config = @{
            general = @{ show_tray_icon = $false }
            applications = @{ index_start_menu = $false; refresh_on_start = $false; directories = @() }
            files = @{ enabled = $false; auto_index = $false; directories = @() }
          }
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $configPath -Encoding utf8
          $baselineApp = Start-Process -FilePath $baselineExe -ArgumentList @("--hidden", "--no-hotkey", "--allow-multiple") -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $baselineApp.Refresh()
          if ($baselineApp.HasExited) { throw "SeekR v$baselineVersion exited during startup (code $($baselineApp.ExitCode))" }
          Stop-Process -Id $baselineApp.Id -Force
          if (-not (Test-Path -LiteralPath $databasePath)) { throw "SeekR v$baselineVersion did not create its user database" }
          $dataScript = Join-Path $downloadDir "upgrade_data.py"
          $dataScriptSource = @'
          import sqlite3
          import sys
          import time
          mode, database_path = sys.argv[1:3]
          with sqlite3.connect(database_path) as connection:
              if mode == "seed":
                  connection.execute("DELETE FROM notes WHERE title = ?", ("SeekR upgrade sentinel",))
                  now = time.time()
                  connection.execute(
                      "INSERT INTO notes (title, body, pinned, created, updated) VALUES (?, ?, 0, ?, ?)",
                      ("SeekR upgrade sentinel", "Preserve this note across install", now, now),
                  )
                  print("seeded")
              elif mode == "verify":
                  row = connection.execute(
                      "SELECT count(*) FROM notes WHERE title = ? AND body = ?",
                      ("SeekR upgrade sentinel", "Preserve this note across install"),
                  ).fetchone()
                  print(0 if row is None else row[0])
              else:
                  raise SystemExit(f"Unknown mode: {mode}")
          '@
          $dataScriptSource | Set-Content -LiteralPath $dataScript -Encoding utf8
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json -AsHashtable
          $config["general"]["hotkey"] = "Ctrl+Alt+Shift+Z"
          $config["general"]["upgrade_smoke_sentinel"] = "preserve-me"
          $config | ConvertTo-Json -Depth 50 | Set-Content -LiteralPath $configPath -Encoding utf8
          python $dataScript seed $databasePath
          if ($LASTEXITCODE -ne 0) { throw "Could not seed the v2.0.2 user database" }
          $installer = (Resolve-Path ".\dist\installer\SeekR-Setup-$version.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$upgradeDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "SeekR upgrade installer exited with code $($process.ExitCode)" }
          $installedExe = Join-Path $upgradeDir "SeekR.exe"
          if (-not (Test-Path -LiteralPath $installedExe)) { throw "SeekR.exe is missing after upgrade" }
          $metadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installedExe)
          if ($metadata.ProductName -ne "SeekR" -or $metadata.ProductVersion -notlike "$version*") {
            throw "Upgraded executable has wrong metadata: ProductName=$($metadata.ProductName); ProductVersion=$($metadata.ProductVersion)"
          }
          $updatedConfig = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          if ($updatedConfig.general.hotkey -ne "Ctrl+Alt+Shift+Z" -or $updatedConfig.general.upgrade_smoke_sentinel -ne "preserve-me") {
            throw "SeekR upgrade did not preserve existing settings and unknown config keys"
          }
          $appProcess = Start-Process -FilePath $installedExe -ArgumentList @("--hidden", "--no-hotkey", "--allow-multiple") -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $appProcess.Refresh()
          if ($appProcess.HasExited) { throw "Upgraded SeekR exited during startup (code $($appProcess.ExitCode))" }
          Stop-Process -Id $appProcess.Id -Force
          $noteCount = python $dataScript verify $databasePath
          if ($LASTEXITCODE -ne 0 -or [int]$noteCount -ne 1) { throw "SeekR upgrade did not preserve the existing database note" }
          $uninstaller = Join-Path $upgradeDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "Upgraded SeekR uninstaller is missing" }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Upgraded SeekR uninstall exited with code $($uninstallProcess.ExitCode)" }
          if (Test-Path -LiteralPath $installedExe) { throw "Upgraded SeekR files remain after uninstall" }
          if (-not (Test-Path -LiteralPath $configPath) -or -not (Test-Path -LiteralPath $databasePath)) {
            throw "Upgraded uninstall removed user settings or database data"
          }
          Remove-Item -LiteralPath $dataScript -Force
      - name: Stage installer and checksums
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          Copy-Item ".\dist\installer\SeekR-Setup-$version.exe" ".\release\"
          Get-ChildItem ".\release" -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath ".\release\SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: SeekR-Windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          version="$(grep '^APP_VERSION =' core/version.py | cut -d '"' -f 2)"
          tag="$GITHUB_REF_NAME"
          if [[ -z "$version" ]]; then
            echo "Could not read APP_VERSION from core/version.py" >&2
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match APP_VERSION $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: SeekR-Windows-${{ github.sha }}
          path: artifacts
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite published assets." >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SeekR $TAG" --generate-notes
          gh release upload "$TAG" artifacts/SeekR.exe artifacts/SeekR-Setup-*.exe artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY"

          # Keep the public release page's notes authoritative and explicit
          # about hardware-dependent checks that CI cannot perform.
          version="${TAG#v}"
          notes_file="docs/RELEASE_NOTES_${version}.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="docs/RELEASE_NOTES_2.0.0.md"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "SeekR $TAG" \
            --notes-file "$notes_file"
