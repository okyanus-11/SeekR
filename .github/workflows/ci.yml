name: Tests and Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || 'windows' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libfreetype6
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q

  windows-build:
    name: Build Windows executable and installer
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test and build executable
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $metadata = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD\dist\SeekR.exe")
          if ($metadata.ProductName -ne "SeekR" -or $metadata.ProductVersion -notlike "$version*") {
            throw "Unexpected executable metadata: ProductName=$($metadata.ProductName), ProductVersion=$($metadata.ProductVersion)"
          }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DMyAppVersion=$version" ".\installer\seekr.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(".\dist\SeekR.exe", ".\dist\installer\SeekR-Setup-*.exe")
          Get-Item $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SeekR-Windows-${{ github.sha }}
          path: |
            dist/SeekR.exe
            dist/installer/SeekR-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
